# Nginx config for AMLO Frontend
# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

# API cache zone
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

# 🌟 นโยบาย cache ของไฟล์ static (ตั้งชัดเจนเพื่อปิด ZAP: Storable and Cacheable Content)
#    - ไฟล์ build มี hash ในชื่อ → แคชได้นาน (immutable) แต่ต้อง revalidate HTML เสมอ
#    - ค่า default = no-cache สำหรับ HTML/route ของ SPA (ต้องได้ index.html ใหม่เมื่อ deploy)
map $uri $static_cache_control {
    default                            "no-cache";
    ~^/assets/                         "public, max-age=31536000, immutable";
    ~^/(robots\.txt|sitemap\.xml)$     "public, max-age=3600";
    ~^/(Logo\.(png|webp)|favicon\.svg)$ "public, max-age=604800";
}

server {
    listen 80;
    server_name localhost;

    # ซ่อนเวอร์ชัน nginx จาก header "Server:" (แก้ ZAP Low: Server Leaks Version Information)
    server_tokens off;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers (additional to backend helmet)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — มีผลจริงเมื่อให้บริการผ่าน HTTPS (compose mapping 443 ไว้แล้ว)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 🌟 COOP — ปิด ZAP Low: Cross-Origin-Opener-Policy Missing (ตัด window.opener กับเว็บอื่น)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 🌟 CORP — ปิด ZAP Low: Cross-Origin-Resource-Policy Missing (เว็บอื่นดึงไฟล์เราไม่ได้)
    #    ตั้งใจไม่ใส่ที่ /uploads/ (คนละ location) เพื่อให้ฝังรูปข้ามโดเมนได้ตามเดิม
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # 🌟 Cache-Control ตามชนิดไฟล์ (ดู map ด้านบน)
    add_header Cache-Control $static_cache_control always;
    # ⚠️ ไม่ตั้ง COEP (require-corp) — จะทำให้ iframe YouTube / Google Maps ที่เว็บฝังอยู่แสดงไม่ได้
    #    (ZAP ยังแจ้ง 90004 เป็น INFO โดยเจตนา)
    # CSP — YouTube IFrame API + GA4 (production) | Fonts self-hosted แล้ว (ไม่มี Google Fonts CDN)
    # 🌟 frame-ancestors + form-action ปิด ZAP Medium: CSP Failure to Define Directive with No Fallback
    # 🌟 img-src ลบ wildcard "https:" แล้ว — ถ้ามีเนื้อหาฝังรูปจากโดเมนภายนอก ให้ระบุโดเมนนั้นแทน
    # 🌟 style-src-elem 'self' — บล็อก inline <style> ทั้งหมด (ปิด ZAP Medium: CSP style-src unsafe-inline)
    #    โดยย้าย <style> ใน JSX ไปไฟล์ CSS (src/styles/legacy-inline.css) และตัด attribute style
    #    จากเนื้อหาในฐานข้อมูลด้วย sanitizeHtml() (src/utils/sanitizeHtml.ts)
    # 🌟 style-src-attr 'unsafe-inline' — อนุญาตเฉพาะ style attribute เพราะไลบรารีที่ใช้จัดเลย์เอาต์
    #    (Swiper สไลด์หน้าแรก, ตัวลาก/สกอลล์แบบ custom, iframe ของ YouTube) ตั้งค่าแบบ inline
    #    ถ้าไม่เปิด ส่วนสไลด์จะไม่ถูกจัดความกว้างในบางเบราว์เซอร์
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://www.googletagmanager.com; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http://localhost:8080; frame-src https://www.youtube.com https://www.google.com; connect-src 'self' http://localhost:8080 https://www.google-analytics.com; worker-src 'none'; frame-ancestors 'self'; form-action 'self';" always;

    # Auth API proxy (stricter rate limit)
    location /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8080/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Lax";
    }

    # Upload API proxy (upload rate limit)
    location /api/upload/ {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 20M;
        proxy_pass http://backend:8080/api/upload/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; SameSite=Lax";
    }

    # API proxy with general rate limit + cache for GET
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        # Cache GET requests for 1 minute — เฉพาะ request ที่ไม่มี Cookie
        # 🌟 กันข้อมูลเฉพาะบุคคล (เช่น /api/auth/me) ถูก cache แล้วส่งให้คนอื่น
        proxy_cache api_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_bypass $http_cookie;
        proxy_no_cache $http_cookie;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cookie_path / "/; SameSite=Lax";
    }

    # Uploads proxy with long cache
    location /uploads/ {
        # 🌟 ตัด Cache-Control ของ express.static (public, max-age=0) ทิ้ง แล้วประกาศของเราแทน
        #    เพื่อไม่ให้มี Cache-Control ซ้ำ 2 header (ตัวที่ค่า max-age=0 จะทำให้แคชไม่ทำงาน)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, immutable" always;

        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://backend:8080/health;
    }

    # SPA routing - all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}